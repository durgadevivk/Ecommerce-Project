<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <div class="row">
    <div class="col-md-6">
      <img th:src="${product.imageUrl}" class="img-fluid h-50" alt="Product Image">
    </div>
    <div class="col-md-6">
      <h2 class="mb-3" th:text="${product.name}">Product Name</h2>
      <p class="mb-3" th:text="${product.description}">Product Description</p>
      <h3 class="mb-3 text-success" th:text="${'Price: $' + product.price}">Price: $</h3>
      <p class="mb-3" th:text="'Category: ' + ${product.category}">Category: </p>
      <form th:action="@{/api/addToCart}" method="POST">

        <input type="hidden" name="productId" th:value="${product.id}">
        <input type="hidden" name="quantity" th:value="${1}">

        <button type="submit" th:href="@{/api/cart}" class="btn btn-primary">Add to Cart</button>
      </form>
    </div>
  </div>
</div>

</body>
</html>
