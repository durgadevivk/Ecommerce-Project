<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <title>Product Listing</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="p-3 mb-2 bg-dark-subtle text-dark-emphasis">
<div class="container my-5">
    <h1 class="text-center mb-4">Product Listing</h1>

    <!-- Filter Section -->
    <div class="row mb-4">
        <div class="col-md-4">
            <form th:action="@{/api/products}" method="get">
                <div class="mb-3">
                    <label for="category" class="form-label">Filter by Category:</label>
                    <select id="category" name="category" class="form-select" onchange="this.form.submit()">
                        <option value="">All Categories</option>
                        <option th:each="category : ${categories}" th:value="${category}" th:text="${category}">Category</option>
                        <option th:if="${category} == 'All Categories'" th:each="product : ${allProducts}" th:text="${product.name}"></option>

                        <option>Clothing</option>
                        <option>Electronics</option>
                        <option>Accessories</option>
                        <option>FootWear</option>
                    </select>
                </div>
            </form>
        </div>
    </div>


    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div th:each="product : ${products}" class="col">
            <div class="card h-100 text-center">
                <div class="card-body">
                    <img th:src="${product.imageUrl}" class="card-img-top" alt="Product Image">
                    <h5 class="card-title" th:text="${product.name}">Product Name</h5>
                    <p class="card-text">Price: $<span th:text="${product.price}">Price</span></p>
                    <p class="card-text">Category: <span th:text="${product.category}">Category</span></p>
                    <a th:href="@{/api/products/{id}(id=${product.id})}" class="btn btn-primary">View Details</a>

                </div>
            </div>
        </div>
    </div>
</div>
</div>
</body>
</html>
