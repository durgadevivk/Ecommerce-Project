<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="container mt-5">
    <h2 class="mb-4">Checkout</h2>

    <!-- Cart Summary -->
    <div class="table-responsive mb-4">
        <table class="table table-bordered table-hover">
            <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Product Name</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total Price</th>
            </tr>
            </thead>
            <tbody>
            <!-- Iterate over cartItems -->
            <tr th:each="cartItem, iterStat : ${cartItems}">
                <td th:text="${iterStat.index + 1}"></td>
                <td th:text="${cartItem.product.name}">Product Name</td>
                <td th:text="'$' + ${cartItem.product.price}">Price</td>
                <td th:text="${cartItem.quantity}">Quantity</td>
                <td th:text="'$' + ${cartItem.totalPrice}">Total Price</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Total Price -->
    <div class="d-flex justify-content-end">
        <h4>Total Price: <span th:text="'$' + ${totalPrice}">Total Price</span></h4>
    </div>

    <!-- Checkout Form -->
    <div class="mt-5">
        <h4>Customer Details</h4>
        <form th:action="@{/api/placeOrder}" method="post" class="row g-3">
            <!-- Name -->
            <div class="col-md-6">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="John Doe" required>
            </div>

            <!-- Email -->
            <div class="col-md-6">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="example@example.com" required>
            </div>

            <!-- Address -->
            <div class="col-12">
                <label for="address" class="form-label">Shipping Address</label>
                <input type="text" class="form-control" id="address" name="address" placeholder="123 Main Street" required>
            </div>

            <!-- Phone Number -->
            <div class="col-md-6">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="text" class="form-control" id="phone" name="phone" placeholder="+1 (555) 555-5555" required>
            </div>

            <!-- Payment Method -->
            <div class="col-md-6">
                <label for="paymentMethod" class="form-label">Payment Method</label>
                <select id="paymentMethod" name="paymentMethod" class="form-select" required>
                    <option value="" disabled selected>Select Payment Method</option>
                    <option value="credit_card">Credit Card</option>
                    <option value="paypal">PayPal</option>
                    <option value="cash_on_delivery">Cash on Delivery</option>
                </select>
            </div>

            <!-- Submit Button -->
            <div class="col-12 mt-3">
                <button type="submit" th:href="@{/api/checkout}" class="btn btn-success">Complete Order</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
