<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h2 class="mb-4">Your Shopping Cart</h2>

  <!-- Display Cart Items -->
  <div class="table-responsive">
    <table class="table table-bordered table-hover">
      <thead class="table-dark">
      <tr>
        <th>#</th>
        <th>Product Name</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Total Price</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <!-- Iterate over cartItems -->
      <tr th:each="cartItem, iterStat : ${cartItems}">
        <td th:text="${iterStat.index + 1}"></td>
        <td th:text="${cartItem.product.name}">Product Name</td>
        <td th:text="'$' + ${cartItem.product.price}">Price</td>
        <td th:text="${cartItem.quantity}">Quantity</td>
        <td th:text="'$' + ${cartItem.totalPrice}">Total Price</td>
        <td>
          <!-- Remove from Cart -->
          <a th:href="@{/api/cart/remove/{id}(id=${cartItem.id})}" class="btn btn-danger btn-sm">Remove</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- Display Total Price -->
  <div class="d-flex justify-content-end mt-4">
    <h4>Total Price: <span th:text="'$' + ${totalPrice}">Total Price</span></h4>
  </div>

  <!-- Add Item to Cart Form -->
  <div class="mt-5">
    <h5>Add Item to Cart</h5>
    <form th:action="@{/api/addToCart}" method="post" class="row g-3">
      <div class="col-md-6">
        <label for="productId" class="form-label">Product ID</label>
        <input type="number" class="form-control" id="productId" name="productId" required>
      </div>
      <div class="col-md-6">
        <label for="quantity" class="form-label">Quantity</label>
        <input type="number" class="form-control" id="quantity" name="quantity" required>
      </div>
      <div class="col-12 mt-3">
        <button type="submit" class="btn btn-primary">Add to Cart</button>
      </div>
    </form>
  </div>

  <!-- Checkout Button -->
  <div class="d-flex justify-content-end mt-4">
    <a th:href="@{/api/checkout}" class="btn btn-success">Proceed to Checkout</a>
  </div>
</div>

</body>
</html>
